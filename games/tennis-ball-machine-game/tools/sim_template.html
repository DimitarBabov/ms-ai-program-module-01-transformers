<title>Ball Machine Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: app-like dark court world. Level picker on top, court simulator left, Proton settings card right (stacked on phones). */
:root{
  --bg:#2b3651; --panel:#3d4b6b; --deep:#222d47; --card:#e9edf5; --card-ink:#1f2a44; --card-muted:#4a5876;
  --ink:#ffffff; --muted:#c8d3ea; --dim:#97a4c3; --ball:#e4ee2a; --court:#57b97c; --boss:#c46a24; --zone2:#7fd3ff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deep)}
.wrap{max-width:1240px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header.top h1{font-family:var(--display);font-size:32px;margin:0;letter-spacing:.5px}
header.top span{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.worlds{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.worlds button{flex:0 0 auto;border:0;border-radius:999px;background:var(--deep);color:var(--muted);padding:8px 14px;font-weight:600;white-space:nowrap}
.worlds button b{font-family:var(--display);font-size:18px;margin-right:6px;color:var(--ink)}
.worlds button[aria-pressed="true"]{background:var(--ball);color:var(--card-ink)}
.worlds button[aria-pressed="true"] b{color:var(--card-ink)}
.levels{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin:10px 0 16px}
.levels button{border:2px solid transparent;background:var(--panel);border-radius:10px;padding:8px 0;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.levels button.boss{background:var(--boss)}
.levels button[aria-current="true"]{border-color:var(--ball);color:var(--ball)}
.levels button.boss[aria-current="true"]{color:#fff}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}.levels button{font-size:17px;padding:6px 0}}
.stage{background:var(--panel);border-radius:18px;overflow:hidden;position:relative}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;max-width:100%}
.hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-variant-numeric:tabular-nums}
.chip{background:rgba(20,28,46,.82);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.chip b{font-family:var(--display);font-size:18px;color:var(--ball)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;background:var(--deep)}
.btn{border:0;border-radius:12px;background:var(--panel);padding:10px 14px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--ball);color:var(--card-ink);min-width:96px;justify-content:center}
.seg{display:inline-flex;background:var(--panel);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 10px;border-radius:9px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card-ink)}
.spacer{flex:1}
.toggle[aria-pressed="true"]{background:var(--zone2);color:var(--card-ink)}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,28,46,.72);padding:20px}
.over .box{background:var(--deep);border-radius:18px;padding:22px;max-width:340px;text-align:center;display:grid;gap:12px}
.over h3{margin:0;font-family:var(--display);font-size:28px}
.over p{margin:0;color:var(--muted);line-height:1.4}
.over .stars{color:var(--ball);font-size:22px;font-weight:700}
.over .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
aside{background:var(--panel);border-radius:18px;overflow:hidden}
.lvhead{background:var(--deep);padding:16px 20px}
.lvhead.boss{background:linear-gradient(90deg,#7a3b12,#b8641f)}
.eyebrow{font-size:13px;letter-spacing:3px;color:var(--ball);font-weight:700;text-transform:uppercase}
.lvhead h2{font-family:var(--display);font-size:34px;margin:2px 0 2px;text-wrap:balance}
.lvhead .sub{color:var(--muted)}
.bar{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;background:var(--deep);border-top:1px solid rgba(255,255,255,.06);padding:10px 0}
.bar span{display:block;font-size:13px;color:var(--muted)}
.bar b{font-family:var(--display);font-size:22px}
.shots{display:grid;gap:8px;padding:14px 16px 4px;max-height:520px;overflow:auto}
.shot{display:flex;gap:10px;align-items:center;background:var(--card);color:var(--card-ink);border-radius:16px;padding:10px 14px;border:3px solid transparent;transition:border-color .2s}
.shot.now{border-color:var(--ball);box-shadow:0 0 0 2px var(--card-ink) inset}
.shot .n{font-family:var(--display);font-size:28px;width:30px;text-align:center}
.shot .w{flex:1;min-width:0}
.shot .w b{font-size:18px}
.shot .w span{margin-left:4px}
.shot small{display:block;color:var(--card-muted);font-size:13px}
.shot .v{text-align:right}
.shot .v b{font-size:18px;font-variant-numeric:tabular-nums}
.info{padding:10px 20px 18px;display:grid;gap:8px;line-height:1.4}
.k{display:inline-block;min-width:76px;font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:700}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.starline{color:var(--ball);font-size:20px;font-weight:700}
.starline small{color:var(--muted);font-size:14px;font-weight:500}
.foot{font-size:13px;color:var(--dim)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:10px 12px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:0}
@media (prefers-reduced-motion:reduce){.shot{transition:none}}
</style>

<div class="wrap">
  <header class="top"><h1>Ball Machine Quest</h1><span>Level simulator for the Proton · 100 levels</span></header>
  <nav class="worlds" id="worlds" aria-label="Worlds"></nav>
  <nav class="levels" id="levels" aria-label="Levels"></nav>
  <main>
    <section>
      <div class="stage">
        <canvas id="cv" width="800" height="1000" aria-label="Animated court showing the machine's shots and the return target"></canvas>
        <div class="hud"><div class="chip" id="hudBall">Ball <b>0</b> / 10</div><div class="chip" id="hudNext"></div></div>
        <div class="over" id="over" hidden>
          <div class="box">
            <h3 id="overTitle">Level done</h3>
            <p id="overText"></p>
            <div class="stars" id="overStars"></div>
            <div class="row"><button class="btn" id="again">↺ Play again</button><button class="btn primary" id="nextLv">Next level →</button></div>
          </div>
        </div>
      </div>
      <div class="controls">
        <button class="btn primary" id="play">▶ Play</button>
        <button class="btn" id="restart" title="Restart level">↺</button>
        <div class="seg" role="group" aria-label="Simulation speed" id="speed">
          <button data-s="0.5">½×</button><button data-s="1" aria-pressed="true">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
        </div>
        <span class="spacer"></span>
        <button class="btn toggle" id="mirror" aria-pressed="false" title="Left-handed (Mirror)">Lefty</button>
        <button class="btn" id="prev" aria-label="Previous level">←</button>
        <button class="btn" id="next" aria-label="Next level">→</button>
      </div>
      <div class="legend"><span><i style="background:var(--ball)"></i>machine ball</span><span><i style="background:#ff9a4d"></i>his return</span><span><i style="background:rgba(228,238,42,.5);border-radius:2px"></i>target zone</span><span>1× = real Proton timing</span></div>
    </section>
    <aside id="panel"></aside>
  </main>
</div>

<script>
const LV = /*__DATA__*/;
const WORLDS = ["Rally Rookie","Forehand & Backhand","Deep Zone","Fast Feet","Spin Lab","Aim Master","Net Attack","Sky Balls","Chaos Mode","Match Play"];
const LANE_WORD={FW:"wide forehand",F:"forehand",C:"center",B:"backhand",BW:"wide backhand"};
const ROW_NAME={D:"back row",M:"middle row",S:"front row"};
const COL_NAME={FW:"1st",F:"2nd",C:"3rd",B:"4th",BW:"5th"};
const TARGET_TEXT={A:"anywhere in the singles court",B:"past the service line",C:"crosscourt half",D:"down-the-line half",E:"crosscourt corner box",F:"down-the-line corner box",G:"middle deep box"};
const ZCOL=["#ffe94d","#7fd3ff"];

/* ---------- court geometry (metres). z=0 machine baseline, z=23.77 player's baseline. x>0 = right of screen ---------- */
const HW=4.115, NETZ=11.885, LEN=23.77, SVC_M=NETZ-6.40, SVC_P=NETZ+6.40, G=9.81;
const ROWZ={D:22.1,M:19.8,S:14.7}, COLX={FW:-3.2,F:-1.6,C:0,B:1.6,BW:3.2};
const HOME={G:[0,24.6],V:[0,13.9],O:[0,17.2]};

let st = {lv:0, speed:1, mirror:false, playing:false, t:0, sched:null, done:false};
try{ const s=JSON.parse(localStorage.getItem("bmq")||"{}"); if(s.speed) st.speed=s.speed; if(s.mirror) st.mirror=true; }catch(e){}
const save=()=>{ try{localStorage.setItem("bmq",JSON.stringify({speed:st.speed,mirror:st.mirror}))}catch(e){} };
const M=()=>st.mirror?-1:1;

/* ---------- projection ---------- */
const cv=document.getElementById("cv"), cx=cv.getContext("2d");
const CAM={p:[0,21,-19], t:[0,0,12.4]};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm=a=>{const l=Math.hypot(...a);return[a[0]/l,a[1]/l,a[2]/l]};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const F=norm(sub(CAM.t,CAM.p)), R=norm(cross([0,1,0],F)), U=cross(F,R);
let VS=1, OX=0, OY=0, W=800, H=1000;
function rawP(x,y,z){const d=sub([x,y,z],CAM.p);const zc=dot(d,F);return[dot(d,R)/zc,dot(d,U)/zc,zc]}
function fit(){
  const pts=[[-HW-1.4,0,-1.6],[HW+1.4,0,-1.6],[-HW-1.4,0,LEN+1.6],[HW+1.4,0,LEN+1.6],[0,5.6,19]].map(p=>rawP(...p));
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const bw=Math.max(...xs)-Math.min(...xs), bh=Math.max(...ys)-Math.min(...ys);
  VS=Math.min((W-20)/bw,(H-90)/bh);
  OX=W/2-VS*(Math.max(...xs)+Math.min(...xs))/2;
  OY=H/2+28+VS*(Math.max(...ys)+Math.min(...ys))/2;
}
function P(x,y,z){const r=rawP(x,y,z);return[OX+VS*r[0],OY-VS*r[1],r[2]]}
const ppm=z=>VS/rawP(0,0,z)[2]; // pixels per metre at depth
function resize(){
  const r=cv.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(320,r.width); H=W*1.25;
  cv.width=Math.round(W*d); cv.height=Math.round(H*d); cx.setTransform(d,0,0,d,0,0); fit(); draw();
}

/* ---------- helpers for drawing on ground ---------- */
function poly3(pts,fill,stroke,lw,dash){
  cx.beginPath(); pts.forEach((p,i)=>{const q=P(p[0],p[1]||0,p[2]);i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1])}); cx.closePath();
  if(fill){cx.fillStyle=fill;cx.fill()}
  if(stroke){cx.setLineDash(dash||[]);cx.strokeStyle=stroke;cx.lineWidth=lw||2;cx.stroke();cx.setLineDash([])}
}
function rectG(x0,x1,z0,z1,fill,stroke,lw,dash){poly3([[x0,0,z0],[x1,0,z0],[x1,0,z1],[x0,0,z1]],fill,stroke,lw,dash)}
function line3(a,b,c,w){const p=P(...a),q=P(...b);cx.beginPath();cx.moveTo(p[0],p[1]);cx.lineTo(q[0],q[1]);cx.strokeStyle=c;cx.lineWidth=w;cx.stroke()}
function ringG(x,z,r,stroke,lw,fill){cx.beginPath();for(let i=0;i<=24;i++){const a=i/24*Math.PI*2;const q=P(x+Math.cos(a)*r,0,z+Math.sin(a)*r);i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1])}
  if(fill){cx.fillStyle=fill;cx.fill()} if(stroke){cx.strokeStyle=stroke;cx.lineWidth=lw;cx.stroke()}}
function pill(x,y,text,col){cx.font="700 15px Barlow, sans-serif";const w=cx.measureText(text).width+20;
  cx.fillStyle="#1f2a44";cx.strokeStyle=col;cx.lineWidth=2;cx.beginPath();cx.roundRect(x-w/2,y-13,w,26,13);cx.fill();cx.stroke();
  cx.fillStyle=col;cx.textAlign="center";cx.textBaseline="middle";cx.fillText(text,x,y+1)}

/* ---------- targets ---------- */
const sideOf=lane=>lane==="F"||lane==="FW"?"FH":lane==="B"||lane==="BW"?"BH":"C";
function zoneRect(letter,side){ // side FH/BH; FH hits from screen-left (x<0) for a right-hander
  const m=M();
  if(letter==="A")return[-HW,HW,0,NETZ];
  if(letter==="B")return[-HW,HW,0,SVC_M];
  if(letter==="G")return[-1.5,1.5,1.2,4.8];
  const cross=(side==="FH"); let right = (letter==="C"||letter==="E")?cross:!cross; // right = +x before mirror
  if(m<0) right=!right;
  if(letter==="C"||letter==="D") return right?[0,HW,0,NETZ]:[-HW,0,0,NETZ];
  return right?[HW-3,HW,0,3]:[-HW,-HW+3,0,3];
}
function sidesOf(shots){const s=new Set();shots.forEach(h=>{const v=sideOf(h.l);if(v==="C"){s.add("FH");s.add("BH")}else s.add(v)});return["FH","BH"].filter(x=>s.has(x))}
function zoneGroups(L){
  const parts=L.target.split("/").map(s=>s.trim()), sh=L.shots;
  if(parts.length===1)return[{letter:parts[0],sides:sidesOf(sh),ci:0}];
  if(parts.includes("A"))return[{letter:parts.find(p=>p!=="A"),sides:sidesOf(sh),ci:0}];
  if(parts.includes("E")&&parts.includes("F"))return[{letter:"E",sides:["FH","BH"],ci:0,label:"box"}];
  if(!L.random&&sh.length%2===0)return[{letter:parts[0],sides:sidesOf(sh.filter((_,i)=>i%2===0)),ci:0},{letter:parts[1],sides:sidesOf(sh.filter((_,i)=>i%2===1)),ci:1}];
  return parts.map((p,i)=>({letter:p,sides:sidesOf(sh),ci:i}));
}
function ballTarget(L,shot,shotIdx,ballIdx){
  const parts=L.target.split("/").map(s=>s.trim());
  let letter=parts[0];
  if(L.n===94) letter=["B","B","A"][shotIdx]||"A";
  else if(parts.includes("E")&&parts.includes("F")) letter=Math.random()<.5?"E":"F";
  else if(parts.length===2) letter=parts[ballIdx%2];
  let side=sideOf(shot.l); if(side==="C") side=Math.random()<.5?"FH":"BH";
  const r=zoneRect(letter,side), mg=.45;
  return {letter,x:r[0]+mg+Math.random()*(r[1]-r[0]-2*mg), z:r[2]+mg+Math.random()*(r[3]-r[2]-2*mg)};
}

/* ---------- physics / schedule ---------- */
function flight(p0,p1,T){const vy=(p1[1]-p0[1]+.5*G*T*T)/T;return{p0,p1,T,vy}}
function at(f,t){const k=t/f.T;return[f.p0[0]+(f.p1[0]-f.p0[0])*k, f.p0[1]+f.vy*t-.5*G*t*t, f.p0[2]+(f.p1[2]-f.p0[2])*k]}
function clearNet(p0,p1,T){ // lengthen T until it clears the net comfortably
  for(let i=0;i<40;i++){const f=flight(p0,p1,T);const k=(NETZ-p0[2])/(p1[2]-p0[2]);if(k<=0||k>=1)return f;const y=at(f,k*T)[1];if(y>1.25)return f;T*=1.07}
  return flight(p0,p1,T);
}
function makeBall(L,shot,si,bi,tl){
  const m=M(), j=()=>(Math.random()-.5)*.5;
  const p0=[0,1.0,-.35], pb=[COLX[shot.l]*m+j(),0,ROWZ[shot.d]+j()];
  const v=shot.kmh/3.6, d=Math.hypot(pb[0]-p0[0],pb[2]-p0[2]);
  const f1=shot.riser?flight(p0,pb,d/(v*.55)):clearNet(p0,pb,d/(v*.86));
  const vimp=G*f1.T-f1.vy, e=shot.rpm<0?.42:.55+Math.min(shot.rpm,2000)/9000;
  const hk=shot.rpm<0?.62:.72+shot.rpm/12000, dir=[(pb[0]-p0[0])/d,(pb[2]-p0[2])/d], vh=d/f1.T*hk, vyb=vimp*e;
  const after=t=>[pb[0]+dir[0]*vh*t, vyb*t-.5*G*t*t, pb[2]+dir[1]*vh*t];
  let th,hp; // time of hit (from launch) and hit position
  if(shot.hit==="V"){const zv=Math.min(pb[2]-1.2,14.2);th=f1.T*(zv-p0[2])/(pb[2]-p0[2]);hp=at(f1,th)}
  else if(shot.hit==="O"){const y0=p0[1],q=f1.vy*f1.vy-2*G*(2.5-y0);th=q>0?(f1.vy+Math.sqrt(q))/G:f1.T*.85;th=Math.min(th,f1.T*.95);hp=at(f1,th)}
  else{let tp=vyb/G*.95;const vz=dir[1]*vh;if(vz>0)tp=Math.min(tp,(LEN+.9-pb[2])/vz);tp=Math.max(tp,.18);th=f1.T+tp;hp=after(tp);hp[1]=Math.max(hp[1],.45)}
  const fh=(sideOf(shot.l)==="BH")?false:true;
  const stance=[hp[0]+(fh?.75:-.75)*m, hp[2]+.25];
  const tg=ballTarget(L,shot,si,bi);
  const rs=shot.hit==="V"?13:shot.hit==="O"?19:Math.max(15,v*.75);
  const pl=[tg.x,0,tg.z], dr=Math.hypot(pl[0]-hp[0],pl[2]-hp[2]);
  const f2=clearNet(hp,pl,dr/rs);
  return {shot,si,bi,tl,f1,after,th,hp,stance,f2,tg,tLand:tl+th+f2.T,tEnd:tl+th+f2.T+1.3,fh};
}
function buildSchedule(L){
  const balls=[]; let t=1.2, last=-1;
  for(let i=0;i<L.balls;i++){
    let si;
    if(L.random){do{si=Math.floor(Math.random()*L.shots.length)}while(L.shots.length>1&&si===last)}else si=i%L.shots.length;
    if(i>0)t+=L.shots[si].delay;
    balls.push(makeBall(L,L.shots[si],si,i,t)); last=si;
  }
  // player key frames
  const keys=[]; const home=h=>HOME[h].slice();
  let pos=home(balls[0].shot.hit); keys.push([0,pos]);
  balls.forEach((b,i)=>{
    const hitT=b.tl+b.th;
    keys.push([Math.max(b.tl+.1,keys[keys.length-1][0]),keys[keys.length-1][1]]);
    keys.push([hitT,b.stance]); keys.push([hitT+.25,b.stance]);
    const nx=balls[i+1]; const hm=home(nx?nx.shot.hit:b.shot.hit);
    keys.push([Math.min(hitT+1.5,nx?nx.tl+.1:hitT+1.5),hm]);
  });
  return {balls,keys,end:balls[balls.length-1].tEnd};
}
function playerAt(t){
  const k=st.sched.keys; let a=k[0],b=k[0];
  for(let i=1;i<k.length;i++){if(k[i][0]>=t){a=k[i-1];b=k[i];break} a=b=k[i]}
  if(a===b||b[0]<=a[0])return{x:b[1][0],z:b[1][1],mv:0};
  let u=Math.min(1,Math.max(0,(t-a[0])/(b[0]-a[0])));const s=u*u*(3-2*u);
  const dist=Math.hypot(b[1][0]-a[1][0],b[1][1]-a[1][1]);
  return{x:a[1][0]+(b[1][0]-a[1][0])*s, z:a[1][1]+(b[1][1]-a[1][1])*s, mv:dist>.05&&u>0&&u<1?1:0};
}
function ballPos(b,t){ // t = sim time; returns {p,phase} or null
  const lt=t-b.tl; if(lt<0||t>b.tEnd)return null;
  if(lt<b.th){ if(lt<b.f1.T)return{p:at(b.f1,lt),ph:0}; return{p:b.after(lt-b.f1.T),ph:1}; }
  const rt=lt-b.th;
  if(rt<b.f2.T)return{p:at(b.f2,rt),ph:2};
  const k=rt-b.f2.T, dx=(b.f2.p1[0]-b.f2.p0[0])/b.f2.T*.55, dz=(b.f2.p1[2]-b.f2.p0[2])/b.f2.T*.55;
  const vy=(G*b.f2.T-b.f2.vy)*.45;
  return{p:[b.f2.p1[0]+dx*k, Math.max(0,vy*k-.5*G*k*k), b.f2.p1[2]+dz*k],ph:3,fade:1-k/1.3};
}

/* ---------- drawing ---------- */
function drawBall(p,col,alpha){
  const g=P(p[0],0,p[2]), s=P(p[0],p[1],p[2]), r=Math.max(4.5,.16*ppm(p[2]));
  cx.globalAlpha=alpha*.35;cx.fillStyle="#0b1220";cx.beginPath();cx.ellipse(g[0],g[1],r*1.1,r*.45,0,0,7);cx.fill();
  cx.globalAlpha=alpha;const gr=cx.createRadialGradient(s[0]-r*.35,s[1]-r*.4,r*.1,s[0],s[1],r);
  gr.addColorStop(0,"#ffffb0");gr.addColorStop(.6,col);gr.addColorStop(1,col==="#e4ee2a"?"#9aa400":"#c2581b");
  cx.fillStyle=gr;cx.beginPath();cx.arc(s[0],s[1],r,0,7);cx.fill();cx.globalAlpha=1;
}
function drawTrail(b,t,col){
  cx.strokeStyle=col;cx.lineCap="round";
  for(let i=1;i<10;i++){const a=ballPos(b,t-i*.025),c=ballPos(b,t-(i-1)*.025);if(!a||!c||a.ph!==c.ph)continue;
    const p=P(...a.p),q=P(...c.p);cx.globalAlpha=(1-i/10)*.5;cx.lineWidth=Math.max(2,.12*ppm(a.p[2]));cx.beginPath();cx.moveTo(p[0],p[1]);cx.lineTo(q[0],q[1]);cx.stroke()}
  cx.globalAlpha=1;
}
function drawPlayer(t){
  const L=LV[st.lv], pl=playerAt(t), s=ppm(pl.z), g=P(pl.x,0,pl.z), m=M();
  // swing phase relative to nearest hit
  let sw=null, kind="G", fh=true;
  for(const b of st.sched.balls){const d=t-(b.tl+b.th);if(d>-.45&&d<.35){sw=d;kind=b.shot.hit;fh=b.fh;break}}
  const hgt=1.45*s, bw=.42*s;
  cx.fillStyle="rgba(11,18,32,.35)";cx.beginPath();cx.ellipse(g[0],g[1],bw*1.1,bw*.35,0,0,7);cx.fill();
  const step=pl.mv?Math.sin(t*16)*.18*s:0;
  cx.strokeStyle="#1f2a44";cx.lineWidth=Math.max(3,.11*s);cx.lineCap="round";
  cx.beginPath();cx.moveTo(g[0]-bw*.25,g[1]);cx.lineTo(g[0]-bw*.18+step,g[1]-hgt*.42);cx.moveTo(g[0]+bw*.25,g[1]);cx.lineTo(g[0]+bw*.18-step,g[1]-hgt*.42);cx.stroke();
  cx.fillStyle="#ff9a4d";cx.beginPath();cx.roundRect(g[0]-bw/2,g[1]-hgt*.8,bw,hgt*.42,bw*.25);cx.fill();
  cx.fillStyle="#f2c9a0";cx.beginPath();cx.arc(g[0],g[1]-hgt*.9,bw*.3,0,7);cx.fill();
  cx.fillStyle="#1f2a44";cx.beginPath();cx.arc(g[0],g[1]-hgt*.94,bw*.3,Math.PI,0);cx.fill();
  // racket: right hand is screen-left for a right-hander (facing the machine)
  const hand=-m, shoulder=[g[0]+hand*bw*.5,g[1]-hgt*.72];
  let ang; // radians, 0 = pointing out to the racket side
  const side=(fh?1:-1);
  if(kind==="O"){ang=sw===null?-1.2:-1.9+Math.min(1,Math.max(0,(sw+.45)/.8))*2.6}
  else if(kind==="V"){ang=sw===null?-.4:-.3+(sw>0?.4:0)}
  else{ang=sw===null?.3:(side>0? -.9+Math.min(1,Math.max(0,(sw+.45)/.8))*2.6 : 2.6-Math.min(1,Math.max(0,(sw+.45)/.8))*2.4)}
  const dx=Math.cos(ang)*hand, dy=Math.sin(ang);
  const len=.62*s, hx=shoulder[0]+dx*len*.45, hy=shoulder[1]+dy*len*.45, tx=shoulder[0]+dx*len, ty=shoulder[1]+dy*len;
  cx.strokeStyle="#f2c9a0";cx.lineWidth=Math.max(2.5,.08*s);cx.beginPath();cx.moveTo(...shoulder);cx.lineTo(hx,hy);cx.stroke();
  cx.strokeStyle="#20263a";cx.lineWidth=Math.max(2,.05*s);cx.beginPath();cx.moveTo(hx,hy);cx.lineTo(hx+(tx-hx)*.45,hy+(ty-hy)*.45);cx.stroke();
  cx.strokeStyle="#ffffff";cx.lineWidth=Math.max(2,.045*s);cx.beginPath();cx.ellipse(hx+(tx-hx)*.75,hy+(ty-hy)*.75,len*.2,len*.15,Math.atan2(ty-hy,tx-hx),0,7);cx.stroke();
}
function drawMachine(){
  const g=P(0,0,-.55), s=ppm(-.55);
  cx.fillStyle="rgba(0,0,0,.3)";cx.beginPath();cx.ellipse(g[0],g[1],.45*s,.12*s,0,0,7);cx.fill();
  cx.fillStyle="#111";cx.beginPath();cx.roundRect(g[0]-.22*s,g[1]-.75*s,.44*s,.75*s,.06*s);cx.fill();
  cx.fillStyle="#2c4a7a";cx.beginPath();cx.moveTo(g[0]-.4*s,g[1]-.95*s);cx.lineTo(g[0]+.4*s,g[1]-.95*s);cx.lineTo(g[0]+.26*s,g[1]-.72*s);cx.lineTo(g[0]-.26*s,g[1]-.72*s);cx.fill();
  cx.fillStyle="#444";cx.beginPath();cx.arc(g[0],g[1]-.3*s,.08*s,0,7);cx.fill();
}
function drawNet(){
  const x0=-HW-.9,x1=HW+.9, a=P(x0,0,NETZ),b=P(x1,0,NETZ),c=P(x1,1.0,NETZ),d=P(x0,1.0,NETZ);
  cx.fillStyle="rgba(40,46,60,.35)";cx.beginPath();cx.moveTo(...a);cx.lineTo(...b);cx.lineTo(...c);cx.lineTo(...d);cx.fill();
  cx.strokeStyle="rgba(210,215,225,.45)";cx.lineWidth=1;
  for(let x=x0;x<=x1;x+=.35)line3([x,0,NETZ],[x,.96,NETZ],"rgba(210,215,225,.35)",1);
  for(let y=.16;y<.96;y+=.16)line3([x0,y,NETZ],[x1,y,NETZ],"rgba(210,215,225,.35)",1);
  line3([x0,.98,NETZ],[x1,.92,NETZ],"#f4f4f4",3.5);
  line3([x0,0,NETZ],[x0,1.07,NETZ],"#eee",4);line3([x1,0,NETZ],[x1,1.07,NETZ],"#eee",4);
}
function drawCourt(t){
  const L=LV[st.lv];
  cx.fillStyle="#3d4b6b";cx.fillRect(0,0,W,H);
  rectG(-HW-1.6,HW+1.6,-2.2,LEN+2.2,"#57b97c");
  // target zones
  const seen=new Set(), labels=[];
  zoneGroups(L).forEach(g=>{
    const sides=["A","B","G"].includes(g.letter)?[null]:g.sides;
    sides.forEach(sd=>{const r=zoneRect(g.letter,sd);const key=r.map(v=>v.toFixed(2)).join();if(seen.has(key))return;seen.add(key);
      rectG(r[0],r[1],r[2],r[3],g.ci?"rgba(127,211,255,.42)":"rgba(255,233,77,.42)",ZCOL[g.ci],3,[10,6]);
      labels.push([(r[0]+r[1])/2,(r[2]+r[3])/2,g.label||(sd?`${g.letter}·${sd}`:g.letter),ZCOL[g.ci]]);});
  });
  // lines
  const Lw=3;
  [[[-HW,0,0],[HW,0,0]],[[-HW,0,LEN],[HW,0,LEN]],[[-HW,0,0],[-HW,0,LEN]],[[HW,0,0],[HW,0,LEN]],[[-HW,0,SVC_M],[HW,0,SVC_M]],[[-HW,0,SVC_P],[HW,0,SVC_P]],[[0,0,SVC_M],[0,0,SVC_P]],[[0,0,LEN],[0,0,LEN-.3]]].forEach(l=>line3(l[0],l[1],"#ffffff",Lw));
  labels.forEach(l=>{const q=P(l[0],0,l[1]);pill(q[0],q[1],l[2],l[3])});
  // the 15 Proton spots on the player's side
  const next=nextBall(t), used={};
  L.shots.forEach((s,i)=>{(used[s.d+s.l]=used[s.d+s.l]||[]).push(i+1)});
  for(const d of ["D","M","S"])for(const l of ["FW","F","C","B","BW"]){
    const x=COLX[l]*M(), z=ROWZ[d], on=used[d+l];
    const hot=next&&next.shot.d===d&&next.shot.l===l;
    ringG(x,z,.42,hot?"#e4ee2a":on?"rgba(255,255,255,.95)":"rgba(255,255,255,.55)",hot?4:on?3:2,hot?"rgba(228,238,42,.35)":on?"rgba(255,255,255,.18)":null);
    if(on){const q=P(x,0,z);cx.font=`800 ${Math.max(11,.28*ppm(z))}px Barlow, sans-serif`;cx.fillStyle=hot?"#e4ee2a":"#fff";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(L.random?"?":on.join(","),q[0],q[1]+.5*ppm(z)*.9)}
  }
  // faint planned arcs from machine to each spot
  cx.setLineDash([4,6]);cx.strokeStyle="rgba(255,255,255,.22)";cx.lineWidth=1.5;
  const done=new Set();
  L.shots.forEach(s=>{const k=s.d+s.l;if(done.has(k))return;done.add(k);
    const p0=[0,1,-.35],pb=[COLX[s.l]*M(),0,ROWZ[s.d]],d=Math.hypot(pb[0],pb[2]+.35),v=s.kmh/3.6;
    const f=s.riser?flight(p0,pb,d/(v*.55)):clearNet(p0,pb,d/(v*.86));
    cx.beginPath();for(let i=0;i<=30;i++){const q=P(...at(f,f.T*i/30));i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1])}cx.stroke();});
  cx.setLineDash([]);
}
function nextBall(t){if(!st.sched)return null;for(const b of st.sched.balls){if(t<b.tl+b.f1.T)return b}return null}
function draw(){
  if(!st.sched)return;
  const t=st.t; cx.clearRect(0,0,W,H); drawCourt(t);
  const items=[];
  st.sched.balls.forEach(b=>{const r=ballPos(b,t);if(r)items.push({z:r.p[2],kind:"ball",b,r})});
  items.push({z:playerAt(t).z,kind:"player"});
  const far=items.filter(i=>i.z>=NETZ).sort((a,b)=>b.z-a.z), near=items.filter(i=>i.z<NETZ).sort((a,b)=>b.z-a.z);
  const paint=i=>{if(i.kind==="player")return drawPlayer(t);const col=i.r.ph>=2?"#ff9a4d":"#e4ee2a";drawTrail(i.b,t,col);drawBall(i.r.p,col,i.r.fade==null?1:Math.max(0,i.r.fade))};
  far.forEach(paint); drawNet(); near.forEach(paint); drawMachine();
  // landing flashes for returns
  st.sched.balls.forEach(b=>{const k=t-b.tLand;if(k>0&&k<1){ringG(b.f2.p1[0],b.f2.p1[2],.25+k*.8,`rgba(255,154,77,${1-k})`,3)}});
  hud(t);
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
function hud(t){
  const L=LV[st.lv]; let n=0; st.sched.balls.forEach(b=>{if(t>=b.tl)n++});
  $("hudBall").innerHTML=`Ball <b>${n}</b> / ${L.balls}`;
  const nb=nextBall(t);
  $("hudNext").innerHTML=nb?`Next: <b>${nb.shot.d}-${nb.shot.l}</b> · ${nb.shot.kmh} km/h`:"Machine done";
  document.querySelectorAll(".shot").forEach((el,i)=>el.classList.toggle("now",!!nb&&!L.random&&nb.si===i||(!!nb&&L.random&&nb.si===i)));
}
function spinTxt(r){return r===0?"0 rpm":r>0?`+${r} rpm topspin`:`${r} rpm backspin`}
function renderPanel(){
  const L=LV[st.lv], boss=L.n%10===0, loops=Math.ceil(L.balls/L.shots.length), riser=L.shots.some(s=>s.riser);
  const parts=L.target.split("/").map(s=>s.trim());
  $("panel").innerHTML=`
  <div class="lvhead${boss?" boss":""}"><div class="eyebrow">Level ${L.n}${boss?" · Boss":""}</div><h2>${L.name}</h2>
  <div class="sub">World ${L.world}: ${WORLDS[L.world-1]} · save as <b>${L.save}</b></div></div>
  <div class="bar"><div><span>Loops</span><b>${loops}</b></div><div><span>Order</span><b>${L.random?"Random":"In order"}</b></div><div><span>Riser</span><b>${riser?"ON":"Off"}</b></div><div><span>Balls</span><b>${L.balls}</b></div></div>
  <div class="shots">${L.shots.map((s,i)=>`<div class="shot"><div class="n">${L.random?"?":i+1}</div>
    <div class="w"><b>${s.d}-${s.l}</b><span>${LANE_WORD[s.l]}</span><small>${ROW_NAME[s.d]}, ${COL_NAME[s.l]} from left</small></div>
    <div class="v"><b>${s.kmh} km/h</b><small>${spinTxt(s.rpm)}${s.riser?" · Riser ON":""}</small><small>delay ${s.delay} s</small></div></div>`).join("")}</div>
  <div class="info">
    <div><span class="k">HIT TO</span>${parts.map((p,i)=>`<span class="sw" style="background:${ZCOL[i]}"></span><b>${p}</b> ${TARGET_TEXT[p]}`).join(" &nbsp;/&nbsp; ")}</div>
    <div class="starline"><span class="k">STARS</span>★ ${L.stars[0]} &nbsp; ★★ ${L.stars[1]} &nbsp; ★★★ ${L.stars[2]} <small>of ${L.balls}</small></div>
    ${L.notes?`<div><span class="k">RULE</span>${L.notes}</div>`:""}
    <div class="foot">${st.mirror?"Lefty view: tap <b>Mirror</b> on this program in the Proton app.":"Left-handed? Tap <b>Mirror</b> in the app (and the Lefty button here)."} Proton location: baseline center · Stand Off.${loops*L.shots.length!==L.balls?` Stop the machine after ${L.balls} balls.`:""}</div>
  </div>`;
}
function renderNav(){
  const L=LV[st.lv];
  $("worlds").innerHTML=WORLDS.map((w,i)=>`<button data-w="${i}" aria-pressed="${L.world===i+1}"><b>${i+1}</b>${w}</button>`).join("");
  const base=(L.world-1)*10;
  $("levels").innerHTML=Array.from({length:10},(_,i)=>{const n=base+i+1;return`<button data-l="${n-1}" class="${n%10===0?"boss":""}" aria-current="${n===L.n}" aria-label="Level ${n}">${n%10===0?"★":""}${n}</button>`}).join("");
  const cur=$("worlds").querySelector('[aria-pressed="true"]'); if(cur) cur.scrollIntoView({block:"nearest",inline:"center"});
}
function setPlaying(p){st.playing=p;$("play").textContent=p?"❚❚ Pause":"▶ Play";if(p){last=performance.now();requestAnimationFrame(loop)}}
function load(i,autoplay){
  st.lv=Math.max(0,Math.min(99,i)); st.t=0; st.done=false; st.sched=buildSchedule(LV[st.lv]);
  $("over").hidden=true; renderNav(); renderPanel(); draw();
  const h="#L"+String(st.lv+1).padStart(3,"0"); if(location.hash!==h) history.replaceState(null,"",h);
  setPlaying(!!autoplay);
}
let last=0;
function loop(now){
  if(!st.playing)return;
  const dt=Math.min(.05,(now-last)/1000); last=now; st.t+=dt*st.speed;
  if(st.t>=st.sched.end){st.t=st.sched.end;draw();finish();return}
  draw(); requestAnimationFrame(loop);
}
function finish(){
  setPlaying(false); const L=LV[st.lv];
  $("overTitle").textContent=`${L.balls} balls done`;
  $("overText").textContent="In real life: count how many of his balls landed in the target zone.";
  $("overStars").innerHTML=`★ ${L.stars[0]} &nbsp; ★★ ${L.stars[1]} &nbsp; ★★★ ${L.stars[2]}`;
  $("nextLv").hidden=st.lv>=99; $("over").hidden=false;
}

$("worlds").addEventListener("click",e=>{const b=e.target.closest("button");if(b)load(+b.dataset.w*10,false)});
$("levels").addEventListener("click",e=>{const b=e.target.closest("button");if(b)load(+b.dataset.l,false)});
$("play").onclick=()=>{if(st.t>=st.sched.end)load(st.lv,true);else setPlaying(!st.playing)};
$("restart").onclick=()=>load(st.lv,true);
$("again").onclick=()=>load(st.lv,true);
$("nextLv").onclick=()=>load(st.lv+1,true);
$("prev").onclick=()=>load(st.lv-1,false);
$("next").onclick=()=>load(st.lv+1,false);
$("speed").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.speed=+b.dataset.s;save();syncSpeed()});
function syncSpeed(){document.querySelectorAll("#speed button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.s===st.speed))}
$("mirror").onclick=()=>{st.mirror=!st.mirror;save();$("mirror").setAttribute("aria-pressed",st.mirror);load(st.lv,st.playing)};
document.addEventListener("keydown",e=>{if(e.target.closest("input"))return;
  if(e.code==="Space"){e.preventDefault();$("play").click()} else if(e.key==="ArrowRight")load(st.lv+1,false); else if(e.key==="ArrowLeft")load(st.lv-1,false)});
function fromHash(){const m=/^#L(\d{1,3})$/.exec(location.hash);return m?Math.min(100,Math.max(1,+m[1]))-1:0}
window.addEventListener("hashchange",()=>{const i=fromHash();if(i!==st.lv)load(i,false)});
window.addEventListener("resize",resize);
syncSpeed(); $("mirror").setAttribute("aria-pressed",st.mirror);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
load(fromHash(),false);
st.t=0; resize();
document.fonts&&document.fonts.ready.then(draw);
</script>
